    <script>
        // Detect if we're in an iframe (embedded in main page) and apply appropriate styling
        document.addEventListener('DOMContentLoaded', function() {
            if (window.self !== window.top) {
                document.body.classList.add('embedded');
            }
        });

        // Initialize translations after DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            // Set up a more reliable translation initialization
            const initializeTranslations = () => {
                // Detect current language from browser or URL
                const urlParams = new URLSearchParams(window.location.search);
                const langParam = urlParams.get('lang');
                const browserLang = navigator.language.split('-')[0];
                const supportedLangs = ['en', 'es', 'ca'];
                const detectedLang = langParam && supportedLangs.includes(langParam) ? langParam :
                                   supportedLangs.includes(browserLang) ? browserLang : 'en';

                // Try to use parent window translations first (for iframe mode)
                if (window.parent && window.parent !== window &&
                    window.parent.getTranslation && window.parent.translations) {
                    window.getTranslation = function(key) {
                        const currentLang = window.parent.getCurrentLanguage();
                        const langData = window.parent.translations[currentLang];
                        return langData && langData.translations ? langData.translations[key] || key : key;
                    };
                    window.getCurrentLanguage = window.parent.getCurrentLanguage;
                    initializeAMBiciTranslations();
                }
                // Otherwise, don't initialize translations - they should come from main system
                else {
                    // No translation system available, use default English
                    window.getTranslation = (key) => key;
                    window.getCurrentLanguage = () => 'en';
                    initializeAMBiciTranslations();
                }
            };

            // Try to initialize immediately, or wait a bit for ES6 modules
            initializeTranslations();
        });

        function initializeAMBiciTranslations() {
            if (!window.getTranslation) return;

            // Translate button text
            const showBikeBtn = document.getElementById('show-bike-stations');
            if (showBikeBtn) {
                showBikeBtn.textContent = '🚲 ' + window.getTranslation('showBikeStations');
            }

            // Translate stat labels
            const statLabels = document.querySelectorAll('.stat-label');
            statLabels.forEach(label => {
                const text = label.textContent.trim();
                if (text === 'Total Stations') {
                    label.textContent = window.getTranslation('totalStations');
                } else if (text === 'Available Bikes') {
                    label.textContent = window.getTranslation('availableBikes');
                } else if (text === 'Available Docks') {
                    label.textContent = window.getTranslation('availableDocks');
                } else if (text === 'Active Stations') {
                    label.textContent = window.getTranslation('activeStations');
                }
            });

            // Translate loading text
            const loading = document.getElementById('loading');
            if (loading) {
                loading.textContent = window.getTranslation('loadingBikeStationData');
            }

            // Translate error text
            const error = document.getElementById('error');
            if (error && error.textContent.includes('Error loading bike station data')) {
                error.textContent = window.getTranslation('errorLoadingBikeStationData');
            }

            // Translate last updated text
            const lastUpdate = document.getElementById('lastUpdate');
            if (lastUpdate && lastUpdate.textContent.includes('Last updated:')) {
                const timePart = lastUpdate.textContent.split(': ')[1];
                lastUpdate.textContent = window.getTranslation('lastUpdated') + ' ' + timePart;
            }
        }
    </script>

<body>
    <div class="container">
        <div class="bike-controls">
            <button id="show-bike-stations" class="bike-toggle-btn">🚲 Show bike stations</button>
            <div id="bike-stations-content" style="display: none; margin-top: 10px;"></div>
        </div>



        <div id="stats" class="stats" style="display: none;">
            <div class="stat-item">
                <div class="stat-number" id="totalStations">0</div>
                <div class="stat-label">Total Stations</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="availableBikes">0</div>
                <div class="stat-label">Available Bikes</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="availableDocks">0</div>
                <div class="stat-label">Available Docks</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="activeStations">0</div>
                <div class="stat-label">Active Stations</div>
            </div>
        </div>

        <div id="loading" class="loading">
            Loading bike station data...
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="lastUpdate" class="last-update" style="display: none;"></div>
    </div>

    <script>
        const STATION_INFO_URL = 'https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_bs/en/station_information.json';
        const STATION_STATUS_URL = 'https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_bs/en/station_status.json';

        let stationInfo = {};
        let stationStatus = {};
        let allStations = [];
        let currentPage = 1;
        let itemsPerPage = 20;

        async function fetchStationData() {
            try {
                // Fetch station information
                const infoResponse = await fetch(STATION_INFO_URL);
                const infoData = await infoResponse.json();
                stationInfo = {};
                infoData.data.stations.forEach(station => {
                    stationInfo[station.station_id] = station;
                });

                // Fetch station status
                const statusResponse = await fetch(STATION_STATUS_URL);
                const statusData = await statusResponse.json();
                stationStatus = {};
                statusData.data.stations.forEach(station => {
                    stationStatus[station.station_id] = station;
                });

                // Combine data
                allStations = Object.keys(stationInfo).map(stationId => {
                    const info = stationInfo[stationId];
                    const status = stationStatus[stationId];
                    return {
                        ...info,
                        ...status,
                        last_reported: status ? new Date(status.last_reported * 1000) : null
                    };
                });

                updateDisplay();
                document.getElementById('lastUpdate').textContent = `Last updated: ${new Date().toLocaleString()}`;
                document.getElementById('lastUpdate').style.display = 'block';

                // Notify parent window about new data
                document.dispatchEvent(new CustomEvent('bikeDataLoaded'));

            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('error').textContent = 'Error loading bike station data. Please try again later.';
                document.getElementById('error').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }
        }

        function updateDisplay() {
            const filteredStations = filterStations();

            // Ensure current page is valid
            const totalPages = Math.ceil(filteredStations.length / itemsPerPage);
            if (currentPage > totalPages && totalPages > 0) {
                currentPage = totalPages;
            }
            if (currentPage < 1) {
                currentPage = 1;
            }

            updateStats(filteredStations);
            renderTable(filteredStations);
            updatePagination(filteredStations);
            const loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';
            const stationsTable = document.getElementById('stationsTable');
            if (stationsTable) stationsTable.style.display = 'table';
            const stats = document.getElementById('stats');
            if (stats) stats.style.display = 'flex';
        }

        function updatePagination(stations) {
            const totalPages = Math.ceil(stations.length / itemsPerPage);
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pagination = document.getElementById('pagination');

            if (!pagination) return;

            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }

            pagination.style.display = 'block';
            if (pageInfo) pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;

            if (prevBtn) prevBtn.disabled = currentPage === 1;
            if (nextBtn) nextBtn.disabled = currentPage === totalPages;
        }

        function filterStations() {
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
            if (!searchTerm) return allStations;

            return allStations.filter(station =>
                station.name && station.name.toLowerCase().includes(searchTerm)
            );
        }

        function updateStats(stations) {
            const totalStations = stations.length;
            const availableBikes = stations.reduce((sum, station) => sum + (station.num_bikes_available || 0), 0);
            const availableDocks = stations.reduce((sum, station) => sum + (station.num_docks_available || 0), 0);
            const activeStations = stations.filter(station => station.is_renting === 1).length;

            document.getElementById('totalStations').textContent = totalStations;
            document.getElementById('availableBikes').textContent = availableBikes;
            document.getElementById('availableDocks').textContent = availableDocks;
            document.getElementById('activeStations').textContent = activeStations;
        }

        function renderTable(stations) {
            const tbody = document.getElementById('stationsBody');
            if (!tbody) return;
            tbody.innerHTML = '';

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const stationsToShow = stations.slice(startIndex, endIndex);

            stationsToShow.forEach(station => {
                const row = document.createElement('tr');

                const nameCell = document.createElement('td');
                nameCell.innerHTML = `<span class="station-name">${station.name || 'Unknown'}</span>`;
                row.appendChild(nameCell);

                const bikesCell = document.createElement('td');
                const bikes = station.num_bikes_available || 0;
                bikesCell.textContent = bikes;
                bikesCell.className = getBikeStatusClass(bikes);
                row.appendChild(bikesCell);

                const docksCell = document.createElement('td');
                docksCell.textContent = station.num_docks_available || 0;
                row.appendChild(docksCell);

                const capacityCell = document.createElement('td');
                capacityCell.textContent = station.capacity || 0;
                row.appendChild(capacityCell);

                const statusCell = document.createElement('td');
                statusCell.textContent = getStationStatus(station);
                row.appendChild(statusCell);

                const updateCell = document.createElement('td');
                updateCell.textContent = station.last_reported ? station.last_reported.toLocaleTimeString() : 'Unknown';
                row.appendChild(updateCell);

                tbody.appendChild(row);
            });
        }

        function getBikeStatusClass(bikes) {
            if (bikes === 0) return 'status-empty';
            if (bikes <= 2) return 'status-low';
            return 'status-available';
        }

        function getStationStatus(station) {
            if (station.is_renting === 0) return 'Not renting';
            if (station.is_returning === 0) return 'Not returning';
            if (station.is_installed === 0) return 'Not installed';
            return 'Active';
        }

        // Search functionality - only add if element exists
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', () => {
                currentPage = 1; // Reset to first page when searching
                updateDisplay();
            });
        }

        // Pagination functionality - only add if elements exist
        const prevBtn = document.getElementById('prevBtn');
        if (prevBtn) {
            prevBtn.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    updateDisplay();
                }
            });
        }

        const nextBtn = document.getElementById('nextBtn');
        if (nextBtn) {
            nextBtn.addEventListener('click', () => {
                const filteredStations = filterStations();
                const totalPages = Math.ceil(filteredStations.length / itemsPerPage);
                if (currentPage < totalPages) {
                    currentPage++;
                    updateDisplay();
                }
            });
        }

        // Initial load
        fetchStationData();

        // Refresh data every 60 seconds
        setInterval(fetchStationData, 60000);

    <script>
        // Global variables for bike stations functionality
        let currentBikePage = 1;
        let itemsPerBikePage = 20;
        window.bikeStationsData = [];

        // Setup bike controls (no map functionality)
        document.addEventListener('DOMContentLoaded', function() {
            setupBikeControls();
        });

        function setupBikeControls() {
            const showBikeStationsBtn = document.getElementById('show-bike-stations');
            const bikeStationsContent = document.getElementById('bike-stations-content');

            if (showBikeStationsBtn && bikeStationsContent) {
                showBikeStationsBtn.addEventListener('click', async function() {
                    if (bikeStationsContent.style.display === 'none' || bikeStationsContent.style.display === '') {
                        // Show bike stations on main map
                        await loadBikeStations();
                        notifyParentShowStations();
                        bikeStationsContent.style.display = 'block';
                        showBikeStationsBtn.textContent = '🚲 ' + window.getTranslation('hideBikeStations');
                        showBikeStationsBtn.classList.add('active');
                    } else {
                        // Hide bike stations from main map
                        notifyParentHideStations();
                        bikeStationsContent.style.display = 'none';
                        showBikeStationsBtn.textContent = '🚲 ' + window.getTranslation('showBikeStations');
                        showBikeStationsBtn.classList.remove('active');
                    }
                });
            }
        }

        async function loadBikeStations() {
            const content = document.getElementById('bike-stations-content');
            content.innerHTML = '<div style="text-align: center; padding: 20px; color: #666;">Loading bike station data...</div>';

            try {
                const STATION_INFO_URL = 'https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_bs/en/station_information.json';
                const STATION_STATUS_URL = 'https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_bs/en/station_status.json';
                const VEHICLE_TYPES_URL = 'https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_bs/en/vehicle_types.json';

                // Fetch all datasets
                const [infoResponse, statusResponse, vehicleTypesResponse] = await Promise.all([
                    fetch(STATION_INFO_URL),
                    fetch(STATION_STATUS_URL),
                    fetch(VEHICLE_TYPES_URL)
                ]);

                const infoData = await infoResponse.json();
                const statusData = await statusResponse.json();
                const vehicleTypesData = await vehicleTypesResponse.json();

                // Create vehicle types lookup with descriptive names
                const vehicleTypesLookup = {};
                if (vehicleTypesData.data && vehicleTypesData.data.vehicle_types) {
                    vehicleTypesData.data.vehicle_types.forEach(vehicleType => {
                        let descriptiveName = vehicleType.name || vehicleType.vehicle_type_id;

                        // Use propulsion_type and form_factor for better descriptions
                        const propulsion = vehicleType.propulsion_type;
                        const formFactor = vehicleType.form_factor;

                        if (propulsion === 'electric') {
                            if (formFactor === 'bicycle') {
                                descriptiveName = 'Electric Bike';
                            } else if (formFactor === 'scooter') {
                                descriptiveName = 'Electric Scooter';
                            } else {
                                descriptiveName = 'Electric Vehicle';
                            }
                        } else if (propulsion === 'human') {
                            if (formFactor === 'bicycle') {
                                descriptiveName = 'Regular Bike';
                            } else if (formFactor === 'scooter') {
                                descriptiveName = 'Manual Scooter';
                            } else {
                                descriptiveName = 'Manual Vehicle';
                            }
                        } else if (propulsion === 'electric_assist') {
                            descriptiveName = 'E-Bike Assist';
                        } else if (propulsion === 'combustion') {
                            descriptiveName = 'Gas Vehicle';
                        } else if (propulsion === 'efit') {
                            descriptiveName = 'Electric Assisted';
                        }

                        vehicleTypesLookup[vehicleType.vehicle_type_id] = {
                            name: descriptiveName,
                            originalName: vehicleType.name || vehicleType.vehicle_type_id,
                            form_factor: vehicleType.form_factor,
                            propulsion_type: vehicleType.propulsion_type
                        };
                    });
                }

                // Store globally for popup use
                window.vehicleTypesLookup = vehicleTypesLookup;

                // Create lookup maps
                const stationInfo = {};
                infoData.data.stations.forEach(station => {
                    stationInfo[station.station_id] = station;
                });

                const stationStatus = {};
                statusData.data.stations.forEach(station => {
                    stationStatus[station.station_id] = station;
                });

                // Combine data
                window.bikeStationsData = Object.keys(stationInfo).map(stationId => {
                    const info = stationInfo[stationId];
                    const status = stationStatus[stationId];
                    return {
                        ...info,
                        ...status,
                        last_reported: status ? new Date(status.last_reported * 1000) : null
                    };
                });

                // Calculate stats including bike types
                const totalStations = window.bikeStationsData.length;
                const availableBikes = window.bikeStationsData.reduce((sum, station) => sum + (station.num_bikes_available || 0), 0);
                const availableDocks = window.bikeStationsData.reduce((sum, station) => sum + (station.num_docks_available || 0), 0);
                const activeStations = window.bikeStationsData.filter(station => station.is_renting === 1).length;

                // Calculate bike type statistics - aggregate by descriptive name, not vehicle_type_id
                const bikeTypeStats = {};
                window.bikeStationsData.forEach(station => {
                    if (station.vehicle_types_available && Array.isArray(station.vehicle_types_available)) {
                        station.vehicle_types_available.forEach(vehicleType => {
                            const typeId = vehicleType.vehicle_type_id || 'unknown';
                            const count = vehicleType.count || 0;

                            // Get the descriptive name from the lookup
                            const typeInfo = window.vehicleTypesLookup ? window.vehicleTypesLookup[typeId] : null;
                            const descriptiveName = typeInfo ? typeInfo.name : (typeId === '1' ? 'Regular Bike' : typeId === '2' ? 'Electric Bike' : typeId === '3' ? 'Cargo Bike' : `Type ${typeId}`);

                            // Use descriptive name as key to aggregate counts
                            if (!bikeTypeStats[descriptiveName]) {
                                bikeTypeStats[descriptiveName] = 0;
                            }
                            bikeTypeStats[descriptiveName] += count;
                        });
                    }
                });

                // Create bike type display
                let bikeTypesHtml = '';
                if (Object.keys(bikeTypeStats).length > 0) {
                    const bikeTypesAvailableText = window.getTranslation ? window.getTranslation('bikeTypesAvailable') : 'Bike Types Available:';
                    bikeTypesHtml = '<div style="background: #e8f5e8; padding: 8px; border-radius: 4px; margin-bottom: 10px; font-size: 11px;">';
                    bikeTypesHtml += `<div style="font-weight: bold; margin-bottom: 4px;">🚲 ${bikeTypesAvailableText}</div>`;
                    Object.entries(bikeTypeStats).forEach(([type, count]) => {
                        const typeInfo = window.vehicleTypesLookup ? window.vehicleTypesLookup[type] : null;
                        let typeName = typeInfo ? typeInfo.name : (type === '1' ? 'Regular Bike' : type === '2' ? 'Electric Bike' : type === '3' ? 'Cargo Bike' : `Type ${type}`);

                        // Translate common vehicle types
                        if (window.getTranslation) {
                            if (typeName === 'Regular Bike') typeName = window.getTranslation('regularBike');
                            else if (typeName === 'Electric Bike') typeName = window.getTranslation('electricBike');
                            else if (typeName === 'Electric Scooter') typeName = window.getTranslation('electricScooter');
                            else if (typeName === 'E-Bike Assist') typeName = window.getTranslation('eBikeAssist');
                            else if (typeName === 'Cargo Bike') typeName = window.getTranslation('cargoBike');
                        }

                        bikeTypesHtml += `<div style="display: inline-block; margin-right: 12px;">${typeName}: <strong>${count}</strong></div>`;
                    });
                    bikeTypesHtml += '</div>';
                }

                // Get translated text for dynamic content
                const searchPlaceholder = window.getTranslation ? window.getTranslation('searchStationsByName') : 'Search stations by name...';
                const stationsText = window.getTranslation ? window.getTranslation('stations') : 'stations';
                const bikesAvailableText = window.getTranslation ? window.getTranslation('bikesAvailable') : 'bikes available';
                const docksAvailableText = window.getTranslation ? window.getTranslation('docksAvailable') : 'docks available';
                const stationHeader = window.getTranslation ? window.getTranslation('station') : 'Station';
                const bikesHeader = window.getTranslation ? window.getTranslation('bikes') : 'Bikes';
                const typesHeader = window.getTranslation ? window.getTranslation('types') : 'Types';
                const docksHeader = window.getTranslation ? window.getTranslation('docks') : 'Docks';
                const statusHeader = window.getTranslation ? window.getTranslation('status') : 'Status';
                const previousText = window.getTranslation ? window.getTranslation('previous') : 'Previous';
                const nextText = window.getTranslation ? window.getTranslation('next') : 'Next';
                const lastUpdatedText = window.getTranslation ? window.getTranslation('lastUpdated') : 'Last updated:';
                const refreshText = window.getTranslation ? window.getTranslation('refresh') : 'Refresh';

                // Create compact display
                content.innerHTML = `
                    <div style="margin-bottom: 10px; text-align: center;">
                        <input type="text" id="bike-search-input" placeholder="${searchPlaceholder}" style="padding: 4px 8px; width: 200px; border: 1px solid #ddd; border-radius: 3px; font-size: 11px;">
                    </div>
                    <div id="bike-stats" style="background: #f8f9fa; padding: 8px; border-radius: 4px; margin-bottom: 10px; font-size: 11px;">
                        <div style="display: flex; justify-content: space-between;">
                            <span><strong id="filtered-total">${totalStations}</strong> ${stationsText}</span>
                            <span><strong id="filtered-bikes">${availableBikes}</strong> ${bikesAvailableText}</span>
                            <span><strong id="filtered-docks">${availableDocks}</strong> ${docksAvailableText}</span>
                        </div>
                    </div>
                    ${bikeTypesHtml}
                    <div style="max-height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px;">
                        <table style="width: 100%; border-collapse: collapse; font-size: 9px;">
                            <thead style="background: #007cba; color: white; position: sticky; top: 0;">
                                <tr>
                                    <th style="padding: 8px; text-align: left;">${stationHeader}</th>
                                    <th style="padding: 8px; text-align: center;">${bikesHeader}</th>
                                    <th style="padding: 8px; text-align: center;">${typesHeader}</th>
                                    <th style="padding: 8px; text-align: center;">${docksHeader}</th>
                                    <th style="padding: 8px; text-align: center;">${statusHeader}</th>
                                </tr>
                            </thead>
                            <tbody id="bike-stations-tbody">
                                ${renderBikeStationsTable()}
                            </tbody>
                        </table>
                        <div id="bike-pagination" style="padding: 8px; text-align: center; background: #f8f9fa; border-top: 1px solid #ddd; display: none;">
                            <button id="bike-prev-btn" style="padding: 4px 8px; margin: 0 4px; background: #007cba; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 11px;">${previousText}</button>
                            <span id="bike-page-info" style="margin: 0 8px; font-size: 11px;"></span>
                            <button id="bike-next-btn" style="padding: 4px 8px; margin: 0 4px; background: #007cba; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 11px;">${nextText}</button>
                        </div>
                    </div>
                    <div style="margin-top: 10px; font-size: 11px; color: #666; text-align: center;">
                        ${lastUpdatedText} ${new Date().toLocaleTimeString()}
                        <button onclick="this.parentElement.parentElement.querySelector('button').click(); loadBikeStations();" style="margin-left: 10px; padding: 2px 6px; background: #007cba; color: white; border: none; border-radius: 2px; cursor: pointer; font-size: 10px;">${refreshText}</button>
                    </div>
                `;

                // Add search functionality for bike stations
                const bikeSearchInput = document.getElementById('bike-search-input');
                if (bikeSearchInput) {
                    bikeSearchInput.addEventListener('input', () => {
                        currentBikePage = 1; // Reset to first page when searching

                        // Update filtered stats
                        const searchTerm = bikeSearchInput.value.toLowerCase();
                        const filteredStations = searchTerm ?
                            window.bikeStationsData.filter(station =>
                                station.name && station.name.toLowerCase().includes(searchTerm)
                            ) : window.bikeStationsData;

                        const filteredTotal = filteredStations.length;
                        const filteredBikes = filteredStations.reduce((sum, station) => sum + (station.num_bikes_available || 0), 0);
                        const filteredDocks = filteredStations.reduce((sum, station) => sum + (station.num_docks_available || 0), 0);

                        document.getElementById('filtered-total').textContent = filteredTotal;
                        document.getElementById('filtered-bikes').textContent = filteredBikes;
                        document.getElementById('filtered-docks').textContent = filteredDocks;

                        const tbody = document.getElementById('bike-stations-tbody');
                        if (tbody) {
                            tbody.innerHTML = renderBikeStationsTable();
                            updateBikePagination();
                        }
                    });
                }

                // Update pagination after content is loaded
                updateBikePagination();
            } catch (error) {
                console.error('Error loading bike stations:', error);
                content.innerHTML = '<div style="text-align: center; padding: 20px; color: #d32f2f;">Error loading bike station data. Please try again.</div>';
            }
        }

        function getBikeColor(station) {
            const bikes = station.num_bikes_available || 0;
            const capacity = station.capacity || 1; // Avoid division by zero
            const percentage = (bikes / capacity) * 100;

            if (percentage === 0) return '#dc3545'; // red (empty)
            if (percentage < 20) return '#ff6b35'; // orange (very low)
            if (percentage < 50) return '#ffc107'; // yellow (low)
            if (percentage < 80) return '#7cb342'; // light green (moderate)
            return '#28a745'; // dark green (80%+)
        }

        function getStatusText(station) {
            if (station.is_renting === 0) return window.getTranslation ? window.getTranslation('notRenting') : 'Not renting';
            if (station.is_returning === 0) return window.getTranslation ? window.getTranslation('notReturning') : 'Not returning';
            if (station.is_installed === 0) return window.getTranslation ? window.getTranslation('notInstalled') : 'Not installed';
            return window.getTranslation ? window.getTranslation('active') : 'Active';
        }

        function showBikeStationsOnMap() {
            if (!map || !window.bikeStationsData.length) return;

            // Remove existing layer if it exists
            if (bikeStationsLayer) {
                map.removeLayer(bikeStationsLayer);
            }

            // Create vector source
            const vectorSource = new ol.source.Vector();

            // Create features for each station
            window.bikeStationsData.forEach(station => {
                if (station.lat && station.lon) {
                    const feature = new ol.Feature({
                        geometry: new ol.geom.Point(ol.proj.fromLonLat([station.lon, station.lat])),
                        station: station
                    });

                    // Style based on bike availability percentage
                    const bikes = station.num_bikes_available || 0;
                    const capacity = station.capacity || 1; // Avoid division by zero
                    const percentage = (bikes / capacity) * 100;

                    let color = '#28a745'; // dark green (80%+)
                    if (percentage === 0) color = '#dc3545'; // red (empty)
                    else if (percentage < 20) color = '#ff6b35'; // orange (very low)
                    else if (percentage < 50) color = '#ffc107'; // yellow (low)
                    else if (percentage < 80) color = '#7cb342'; // light green (moderate)

                    const percentageText = Math.round(percentage) + '%';
                    const combinedText = percentageText + '\n' + bikes;

                    feature.setStyle(new ol.style.Style({
                        image: new ol.style.Circle({
                            radius: 8,
                            fill: new ol.style.Fill({ color: color }),
                            stroke: new ol.style.Stroke({
                                color: '#fff',
                                width: 2
                            })
                        }),
                        text: new ol.style.Text({
                            text: combinedText,
                            font: '10px Arial',
                            fill: new ol.style.Fill({ color: '#000' }),
                            stroke: new ol.style.Stroke({ color: '#fff', width: 2 }),
                            offsetY: -12,
                            textAlign: 'center',
                            textBaseline: 'middle'
                        })
                    }));

                    vectorSource.addFeature(feature);
                }
            });

            // Create vector layer
            bikeStationsLayer = new ol.layer.Vector({
                source: vectorSource,
                title: 'AMBici Bike Stations'
            });

            // Add layer to map
            map.addLayer(bikeStationsLayer);

            // Add popup overlay if not exists
            if (!window.bikeStationPopup) {
                const popupElement = document.createElement('div');
                popupElement.className = 'ol-popup';
                popupElement.style.cssText = `
                    position: absolute;
                    background-color: white;
                    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
                    padding: 15px;
                    border-radius: 10px;
                    border: 1px solid #cccccc;
                    bottom: 12px;
                    left: -50px;
                    min-width: 200px;
                    font-size: 7px;
                    display: none;
                `;
                document.body.appendChild(popupElement);

                window.bikeStationPopup = new ol.Overlay({
                    element: popupElement,
                    positioning: 'bottom-center',
                    stopEvent: false,
                    offset: [0, -10]
                });

                map.addOverlay(window.bikeStationPopup);
            }

            // Remove any existing bike station click handler to avoid duplicates
            if (window.bikeStationClickHandler) {
                map.un('click', window.bikeStationClickHandler);
            }

            // Create and store the click handler
            window.bikeStationClickHandler = function(evt) {
                const feature = map.forEachFeatureAtPixel(evt.pixel, function(feature) {
                    return feature;
                });

                if (feature && feature.get('station')) {
                    const station = feature.get('station');
                    const popupElement = window.bikeStationPopup.getElement();

                    // Build bike types information
                    let bikeTypesInfo = '';
                    if (station.vehicle_types_available && Array.isArray(station.vehicle_types_available)) {
                        bikeTypesInfo = '<div style="margin-top: 8px; font-size: 11px;">';
                        bikeTypesInfo += '<div style="font-weight: bold; margin-bottom: 4px;">🚲 Available by Type:</div>';
                        station.vehicle_types_available.forEach(vehicleType => {
                            const typeId = vehicleType.vehicle_type_id;
                            const typeInfo = window.vehicleTypesLookup ? window.vehicleTypesLookup[typeId] : null;
                            const typeName = typeInfo ? typeInfo.name : typeId;
                            const propulsionType = typeInfo ? typeInfo.propulsion_type : 'unknown';
                            const count = vehicleType.count || 0;
                            if (count > 0) {
                                bikeTypesInfo += `<div>• ${typeName} (${propulsionType}): <strong>${count}</strong></div>`;
                            }
                        });
                        bikeTypesInfo += '</div>';
                    }

                    popupElement.innerHTML = `
                        <div style="font-weight: bold; margin-bottom: 8px;">${station.name || 'Unknown Station'} (${station.station_id})</div>
                        <div>🚲 Available bikes: <strong>${station.num_bikes_available || 0}</strong></div>
                        <div>📍 Available docks: <strong>${station.num_docks_available || 0}</strong></div>
                        <div>📊 Capacity: <strong>${station.capacity || 0}</strong></div>
                        <div>📡 Status: <strong>${getStatusText(station)}</strong></div>
                        ${bikeTypesInfo}
                        ${station.last_reported ? `<div style="margin-top: 8px; font-size: 11px;">🕒 Updated: ${station.last_reported.toLocaleTimeString()}</div>` : ''}
                    `;

                    window.bikeStationPopup.setPosition(evt.coordinate);
                    popupElement.style.display = 'block';

                    // Prevent the default map click behavior
                    evt.stopPropagation();
                    return false;
                } else {
                    window.bikeStationPopup.getElement().style.display = 'none';
                }
            };

            // Add the bike station click handler
            map.on('click', window.bikeStationClickHandler);

            // Close popup when moving away from bike station markers
            map.on('pointermove', function(evt) {
                if (evt.dragging) return;

                // Check if we're hovering over a bike station feature
                let hoveringOverBikeStation = false;
                map.forEachFeatureAtPixel(evt.pixel, function(feature) {
                    if (feature.get('station')) {
                        hoveringOverBikeStation = true;
                        return true; // Stop iteration
                    }
                });

                // Only hide popup if not hovering over a bike station
                if (!hoveringOverBikeStation) {
                    window.bikeStationPopup.getElement().style.display = 'none';
                }
            });
        }

        function hideBikeStationsOnMap() {
            if (map && bikeStationsLayer) {
                map.removeLayer(bikeStationsLayer);
                bikeStationsLayer = null;
            }
            if (window.bikeStationPopup) {
                window.bikeStationPopup.getElement().style.display = 'none';
            }
        }

        function zoomToStation(stationId) {
            // Notify parent window to zoom to the station
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'zoomToBikeStation',
                    stationId: stationId
                }, '*');
            }
        }

        function renderBikeStationsTable() {
            // Filter stations based on search input
            const searchInput = document.getElementById('bike-search-input');
            const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
            const filteredStations = searchTerm ?
                window.bikeStationsData.filter(station =>
                    station.name && station.name.toLowerCase().includes(searchTerm)
                ) : window.bikeStationsData;

            const startIndex = (currentBikePage - 1) * itemsPerBikePage;
            const endIndex = startIndex + itemsPerBikePage;
            const stationsToShow = filteredStations.slice(startIndex, endIndex);

            return stationsToShow.map(station => {
                let bikeTypesText = '';
                if (station.vehicle_types_available && Array.isArray(station.vehicle_types_available)) {
                    bikeTypesText = station.vehicle_types_available.map(vehicleType => {
                        const typeId = vehicleType.vehicle_type_id;
                        const typeInfo = window.vehicleTypesLookup ? window.vehicleTypesLookup[typeId] : null;
                        const typeName = typeInfo ? typeInfo.name : typeId;
                        // Use more descriptive abbreviations
                        let shortName = typeName;
                        if (typeName.includes('Electric Bike')) shortName = 'E-Bike';
                        else if (typeName.includes('Regular Bike')) shortName = 'Bike';
                        else if (typeName.includes('Electric Scooter')) shortName = 'E-Scoot';
                        else if (typeName.includes('Manual Scooter')) shortName = 'Scooter';
                        else shortName = typeName.substring(0, 6); // Fallback to first 6 chars
                        return vehicleType.count > 0 ? `${shortName}:${vehicleType.count}` : '';
                    }).filter(text => text).join(', ');
                }
                return `
                <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 8px;"><span class="station-link" style="font-weight: bold; cursor: pointer; color: #007cba; text-decoration: underline;" onclick="zoomToStation('${station.station_id}')">${station.name || 'Unknown'} (${station.station_id})</span></td>
                    <td style="padding: 8px; text-align: center; color: ${getBikeColor(station)}; font-weight: bold;">
                        ${station.num_bikes_available || 0}
                    </td>
                    <td style="padding: 8px; text-align: center; font-size: 10px;">${bikeTypesText || '-'}</td>
                    <td style="padding: 8px; text-align: center;">${station.num_docks_available || 0}</td>
                    <td style="padding: 8px; text-align: center;">${getStatusText(station)}</td>
                </tr>
                `;
            }).join('');
        }

        function updateBikePagination() {
            const totalPages = Math.ceil(window.bikeStationsData.length / itemsPerBikePage);
            const pageInfo = document.getElementById('bike-page-info');
            const prevBtn = document.getElementById('bike-prev-btn');
            const nextBtn = document.getElementById('bike-next-btn');
            const pagination = document.getElementById('bike-pagination');

            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }

            pagination.style.display = 'block';
            pageInfo.textContent = `Page ${currentBikePage} of ${totalPages}`;

            prevBtn.disabled = currentBikePage === 1;
            nextBtn.disabled = currentBikePage === totalPages;

            // Update button styles based on disabled state
            prevBtn.style.opacity = prevBtn.disabled ? '0.5' : '1';
            nextBtn.style.opacity = nextBtn.disabled ? '0.5' : '1';
        }

        // Add pagination event handlers after DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Bike stations pagination handlers
            document.addEventListener('click', function(e) {
                if (e.target.id === 'bike-prev-btn') {
                    if (currentBikePage > 1) {
                        currentBikePage--;
                        const tbody = document.getElementById('bike-stations-tbody');
                        if (tbody) {
                            tbody.innerHTML = renderBikeStationsTable();
                            updateBikePagination();
                        }
                    }
                } else if (e.target.id === 'bike-next-btn') {
                    const totalPages = Math.ceil(window.bikeStationsData.length / itemsPerBikePage);
                    if (currentBikePage < totalPages) {
                        currentBikePage++;
                        const tbody = document.getElementById('bike-stations-tbody');
                        if (tbody) {
                            tbody.innerHTML = renderBikeStationsTable();
                            updateBikePagination();
                        }
                    }
                }
            });
        });

        // Store data globally for main page map functions
    </script>

    <script>
        // Communication with parent window (main page)
        function notifyParentShowStations() {
            if (window.parent && window.parent !== window) {
                // Send command to show stations on main map
                window.parent.postMessage({
                    type: 'showBikeStations',
                    data: window.bikeStationsData
                }, '*');
            }
        }

        function notifyParentHideStations() {
            if (window.parent && window.parent !== window) {
                // Send command to hide stations from main map
                window.parent.postMessage({
                    type: 'hideBikeStations'
                }, '*');
            }
        }

        function notifyParentAboutStations() {
            if (window.parent && window.parent !== window) {
                // Send station data to parent window for map display
                window.parent.postMessage({
                    type: 'bikeStationsData',
                    data: window.bikeStationsData
                }, '*');
            }
        }

        // Notify parent when data is loaded
        document.addEventListener('bikeDataLoaded', notifyParentAboutStations);

        // Also notify immediately if data is already available
        if (window.bikeStationsData && window.bikeStationsData.length > 0) {
            notifyParentAboutStations();
        }

        // Periodically send updates to parent
        setInterval(() => {
            if (window.bikeStationsData && window.bikeStationsData.length > 0) {
                notifyParentAboutStations();
            }
        }, 30000); // Update every 30 seconds
    </script>

    <script>
        // Contextual menu functionality
        let contextMenu = null;

        function createContextMenu() {
            // Remove existing menu if any
            if (contextMenu) {
                contextMenu.remove();
            }

            // Create the contextual menu
            contextMenu = document.createElement('div');
            contextMenu.className = 'context-menu';
            contextMenu.style.display = 'none';
            document.body.appendChild(contextMenu);

            // Add right-click handler to the document
            document.addEventListener('contextmenu', function(e) {
                // Only show menu if we're in the bike stations area
                const bikeContent = document.getElementById('bike-stations-content');
                if (bikeContent && bikeContent.contains(e.target)) {
                    e.preventDefault();
                    showContextMenu(e.clientX, e.clientY);
                } else {
                    hideContextMenu();
                }
            });

            // Add close button handler
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('context-menu-close')) {
                    hideContextMenu();
                }
            });
        }

        function showContextMenu(x, y) {
            if (!contextMenu) return;

            // Get AMBici vehicle types data
            fetchVehicleTypesData().then(vehicleTypes => {
                // Create menu content with translated title and close button
                const titleKey = window.getTranslation ? window.getTranslation('bikeTypes') : '🚲 Bike Types';
                let menuHtml = `<div class="context-menu-title">${titleKey}<button class="context-menu-close" title="Close menu">×</button></div>`;

                vehicleTypes.forEach(vehicleType => {
                    const propulsionIcon = getPropulsionIcon(vehicleType.propulsion_type);
                    const formFactorIcon = getFormFactorIcon(vehicleType.form_factor);

                    // Get the descriptive name from the lookup first
                    const typeInfo = window.vehicleTypesLookup ? window.vehicleTypesLookup[vehicleType.vehicle_type_id] : null;
                    let vehicleTypeName = typeInfo ? typeInfo.name : (vehicleType.vehicle_type_id === '1' ? 'Regular Bike' : vehicleType.vehicle_type_id === '2' ? 'Electric Bike' : vehicleType.vehicle_type_id === '3' ? 'Cargo Bike' : `Type ${vehicleType.vehicle_type_id}`);

                    // Then translate the descriptive name
                    if (window.getTranslation) {
                        if (vehicleTypeName === 'Regular Bike') vehicleTypeName = window.getTranslation('regularBike');
                        else if (vehicleTypeName === 'Electric Bike') vehicleTypeName = window.getTranslation('electricBike');
                        else if (vehicleTypeName === 'Electric Scooter') vehicleTypeName = window.getTranslation('electricScooter');
                        else if (vehicleTypeName === 'E-Bike Assist') vehicleTypeName = window.getTranslation('eBikeAssist');
                        else if (vehicleTypeName === 'Cargo Bike') vehicleTypeName = window.getTranslation('cargoBike');
                    }

                    menuHtml += `
                        <div class="context-menu-item">
                            <div class="vehicle-type-item">
                                <span class="vehicle-type-name">${formFactorIcon} ${vehicleTypeName}</span>
                                <span class="vehicle-type-info">${propulsionIcon} ${vehicleType.propulsion_type}</span>
                            </div>
                        </div>
                    `;
                });

                contextMenu.innerHTML = menuHtml;

                // Position the menu
                contextMenu.style.left = x + 'px';
                contextMenu.style.top = y + 'px';
                contextMenu.style.display = 'block';

                // Adjust position if menu goes off-screen
                const rect = contextMenu.getBoundingClientRect();
                if (rect.right > window.innerWidth) {
                    contextMenu.style.left = (x - rect.width) + 'px';
                }
                if (rect.bottom > window.innerHeight) {
                    contextMenu.style.top = (y - rect.height) + 'px';
                }
            });
        }

        function hideContextMenu() {
            if (contextMenu) {
                contextMenu.style.display = 'none';
            }
        }

        function getPropulsionIcon(propulsionType) {
            switch (propulsionType) {
                case 'human': return '🚶';
                case 'electric': return '⚡';
                case 'electric_assist': return '🔋';
                case 'combustion': return '⛽';
                default: return '❓';
            }
        }

        function getFormFactorIcon(formFactor) {
            switch (formFactor) {
                case 'bicycle': return '🚴';
                case 'scooter': return '🛵';
                case 'scooter_standing': return '🛵';
                default: return '🚲';
            }
        }

        async function fetchVehicleTypesData() {
            try {
                const response = await fetch('https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_bs/en/vehicle_types.json');
                const data = await response.json();
                return data.data.vehicle_types || [];
            } catch (error) {
                console.error('Error fetching vehicle types:', error);
                return [];
            }
        }

        // Initialize contextual menu when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            createContextMenu();
        });
    </script>
</body>
</html>
