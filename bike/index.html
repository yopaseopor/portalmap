	<div class="flex-row">
	<!--@@ Modificar comentario de Javascript -->
		<div id="map" class="map">Loading... You need Javascript...Cargando necesitas Javascript...Carregant...necessites Javascript</div>
		<div id="menu" class="menu">
			<!-- Language Selector -->
			<div id="language-selector-container" class="language-selector-wrapper"></div>

			<!-- Bike System Search -->
			<div id="value-search-container" style="margin: 10px 0; position: relative;">
			  <input type="text" id="value-search" placeholder="Search bike systems..." style="width: 100%; padding: 5px;">
			  <div id="value-search-dropdown" style="position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ccc; border-top: none; max-height: 200px; overflow-y: auto; z-index: 1000; display: none;"></div>
			  <button id="execute-query-btn" style="display:none; margin-top:5px; width:100%; padding:5px; background:#007cba; color:white; border:none; border-radius:3px; cursor:pointer; font-size:12px;" data-i18n="loadBikeSystem">Load Bike System</button>
			  <button id="clear-search-btn" style="display:none; margin-top:3px; width:100%; padding:3px; background:#666; color:white; border:none; border-radius:3px; cursor:pointer; font-size:12px;" data-i18n="clearButton">Clear</button>
			</div>
			<!-- Bike Stations Container - Embedded separate webpage -->
			<div id="bike-container" style="margin: 0;">
				<iframe id="bike-stations-iframe" src="" style="width: 100%; height: 400px; border: none; margin: 0; padding: 0;" title="Barcelona Bike Stations"></iframe>
			</div>
			<!-- Element Type Filter -->
			<div class="element-type-filter">
			  <label data-i18n="nodesCheckbox"><input type="checkbox" class="element-type-checkbox" value="node" checked> Nodes</label>
			  <label data-i18n="waysCheckbox"><input type="checkbox" class="element-type-checkbox" value="way" checked> Ways</label>
			  <label data-i18n="relationsCheckbox"><input type="checkbox" class="element-type-checkbox" value="relation" checked> Relations</label>
			</div>
			<!-- Query Statistics - moved inside menu next to layers -->
			<div id="query-statistics" class="query-statistics" style="display: none; margin: 0; padding: 8px; background: #f5f5f5; border-radius: 0;">
			  <h4 style="margin: 0 0 8px 0; font-size: 12px; color: #333;" data-i18n="currentQuery">📊 Consulta Actual</h4>
			  <div class="stat-item">
			    <div class="stat-label">Query:</div>
			    <div class="stat-value" id="current-query">-</div>
			  </div>
			  <div class="stat-item">
			    <div class="stat-label" data-i18n="executionTime">Temps:</div>
			    <div class="stat-value" id="execution-time">0.000s</div>
			  </div>
			  <div class="stat-item">
			    <div class="stat-label" data-i18n="nodesLabel">Nodes:</div>
			    <div class="stat-value" id="nodes-count">0</div>
			  </div>
			  <div class="stat-item">
			    <div class="stat-label" data-i18n="waysLabel">Vies:</div>
			    <div class="stat-value" id="ways-count">0</div>
			  </div>
			  <div class="stat-item">
			    <div class="stat-label" data-i18n="relationsLabel">Relacions:</div>
			    <div class="stat-value" id="relations-count">0</div>
			  </div>
			</div>
			<!-- Overlays section -->
			<div id="overlay-list" style="display: none;"></div>
		</div>
	</div>
	<!-- Core Libraries -->
	<!-- jQuery (load first as other scripts depend on it) -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

	<!-- Proj4 for coordinate transformations (must be loaded before OpenLayers) -->

	<!-- OpenLayers CSS -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
	<!-- OpenLayers (must be loaded before ol-cesium) -->
	<script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

	<!-- Cesium configuration -->
    <style>
        /* Cesium widget styles */
        .cesium-widget-credits {
            display: none !important;
        }
    </style>
    <script>
        // Configure Cesium before loading it
        window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.95.0/Build/Cesium/';
        // Disable source maps to prevent console warnings
        window.CESIUM_sourceMap = false;
        // Configure Cesium to use CDN for assets
        window.CESIUM_BASE_URL = window.CESIUM_BASE_URL.replace('Source/', '');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.95.0/Build/Cesium/Cesium.js"></script>
    <!-- ol-cesium with explicit CSS and JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol-cesium@2.15.1/dist/olcs.css">
    <script src="https://cdn.jsdelivr.net/npm/ol-cesium@2.15.1/dist/olcesium.js"></script>

    <!-- osmtogeojson for data conversion -->
    <script src="https://cdn.jsdelivr.net/npm/osmtogeojson@3.0.0-beta.5/osmtogeojson.js"></script>

	<!-- Vector Tile Style -->
	<script src="src/assets/styles/vector-tile-style.js"></script>
	<!-- ol-mapbox-style for MapTiler styles -->
	<script src="https://unpkg.com/ol-mapbox-style@6.1.3/dist/olms.js"></script>
	<!-- Opening Hours Library -->
	<!-- Opening Hours Library (local copy) -->
	<script src="src/vendor/opening_hours.min.js"></script>

	<!-- Vector tile styles -->
	<script src="src/assets/vector-tile-styles.js"></script>

	<!-- Configuration -->
	<script src="src/assets/maptiler-style.js"></script>
	<script src="src/assets/versatiles-style.js"></script>
	<script src="src/assets/customyopaseopor-style.js"></script>
	<script src="src/config.js"></script>

	<!-- Modules -->
	<script type="module" src="src/components/LanguageSelector.js"></script>
	<script type="module" src="src/language_init.js"></script>
	<script type="module" src="src/overlays/translated_overlays.js"></script>
	<!--<script type="module" src="src/overlays/external/loader.js"></script>-->
	<script type="module" src="src/overlays/index.js"></script>
	<script type="module" src="src/overlay_integration.js"></script>
	<script type="module" src="src/init.js"></script>

	<!-- Application Logic -->
	<script src="src/taginfo_api.js"></script>
	<script src="src/systems_api.js"></script>
	<script src="src/value_search.js"></script>
	<script src="src/nominatim_search.js"></script>
	<script src="src/panoramax_viewer.js"></script>
	<script src="src/mapillary_viewer.js"></script>
	<script src="src/router.js"></script>
	<script src="src/index.js"></script>

	<!-- Bike Stations Map Integration -->
	<script>
		let bikeStationsLayer = null;
		let bikeStationsPopup = null;

		// Listen for messages from the embedded bike stations iframe
		window.addEventListener('message', function(event) {
			// Basic origin check for security (you might want to restrict this further)
			if (event.data.type === 'showBikeStations') {
				displayBikeStationsOnMap(event.data.data);
			} else if (event.data.type === 'hideBikeStations') {
				hideBikeStationsFromMap();
			} else if (event.data.type === 'zoomToBikeStation') {
				zoomToBikeStation(event.data.stationId);
			} else if (event.data.type === 'showBirdScooters') {
				displayBikeStationsOnMap(event.data.data);
			} else if (event.data.type === 'hideBirdScooters') {
				hideBikeStationsFromMap();
			} else if (event.data.type === 'birdScootersData') {
				// Update global bike stations data for zoom functionality
				window.bikeStationsData = event.data.data;
			}
		});

		function displayBikeStationsOnMap(stationsData) {
			if (!window.map || !stationsData || !stationsData.length) return;

			// Store data globally for zoom functionality
			window.bikeStationsData = stationsData;

			// Remove existing layer if it exists
			if (bikeStationsLayer) {
				window.map.removeLayer(bikeStationsLayer);
			}

			// Create vector source
			const vectorSource = new ol.source.Vector();

			// Create features for each station
			stationsData.forEach(station => {
				if (station.lat && station.lon) {
					const feature = new ol.Feature({
						geometry: new ol.geom.Point(ol.proj.fromLonLat([station.lon, station.lat])),
						station: station
					});

					// Style based on bike availability percentage
					const bikes = station.num_bikes_available || 0;
					const capacity = station.capacity || 1; // Avoid division by zero
					const percentage = (bikes / capacity) * 100;

					let color = '#28a745'; // dark green (80%+)
					if (percentage === 0) color = '#dc3545'; // red (empty)
					else if (percentage < 20) color = '#ff6b35'; // orange (very low)
					else if (percentage < 50) color = '#ffc107'; // yellow (low)
					else if (percentage < 80) color = '#7cb342'; // light green (moderate)

					const percentageText = Math.round(percentage) + '%';
					const combinedText = percentageText + '\n' + bikes;

					feature.setStyle(new ol.style.Style({
						image: new ol.style.Circle({
							radius: 8,
							fill: new ol.style.Fill({ color: color }),
							stroke: new ol.style.Stroke({
								color: '#fff',
								width: 2
							})
						}),
						text: new ol.style.Text({
							text: combinedText,
							font: '10px Arial',
							fill: new ol.style.Fill({ color: '#000' }),
							stroke: new ol.style.Stroke({ color: '#fff', width: 2 }),
							offsetY: -12,
							textAlign: 'center',
							textBaseline: 'middle'
						})
					}));

					vectorSource.addFeature(feature);
				}
			});

			// Create vector layer
			bikeStationsLayer = new ol.layer.Vector({
				source: vectorSource,
				title: 'Barcelona Bike Stations'
			});

			// Add layer to map
			window.map.addLayer(bikeStationsLayer);

			// Add popup overlay if not exists
			if (!bikeStationsPopup) {
				const popupElement = document.createElement('div');
				popupElement.className = 'ol-popup';
				popupElement.style.cssText = `
					position: absolute;
					background-color: white;
					box-shadow: 0 1px 4px rgba(0,0,0,0.2);
					padding: 15px;
					border-radius: 10px;
					border: 1px solid #cccccc;
					bottom: 12px;
					left: -50px;
					min-width: 200px;
					font-size: 12px;
					display: none;
					z-index: 1000;
				`;
				document.body.appendChild(popupElement);

				bikeStationsPopup = new ol.Overlay({
					element: popupElement,
					positioning: 'bottom-center',
					stopEvent: false,
					offset: [0, -10]
				});

				window.map.addOverlay(bikeStationsPopup);
			}

			// Remove any existing bike station click handler to avoid duplicates
			if (window.bikeStationClickHandler) {
				window.map.un('click', window.bikeStationClickHandler);
			}

			// Create and store the click handler
			window.bikeStationClickHandler = function(evt) {
				const feature = window.map.forEachFeatureAtPixel(evt.pixel, function(feature) {
					return feature;
				});

				if (feature && feature.get('station')) {
					const station = feature.get('station');
					const popupElement = bikeStationsPopup.getElement();

					// Build bike types information
					let bikeTypesInfo = '';
					if (station.vehicle_types_available && Array.isArray(station.vehicle_types_available)) {
						bikeTypesInfo = '<div style="margin-top: 8px; font-size: 11px;">';
						bikeTypesInfo += '<div style="font-weight: bold; margin-bottom: 4px;">🚲 Available by Type:</div>';
                        station.vehicle_types_available.forEach(vehicleType => {
                            const typeId = vehicleType.vehicle_type_id;
                            const typeInfo = window.vehicleTypesLookup ? window.vehicleTypesLookup[typeId] : null;
                            const typeName = typeInfo ? typeInfo.name : typeId;
                            const count = vehicleType.count || 0;
                            if (count > 0) {
                                bikeTypesInfo += `<div>• ${typeName} (${typeId}): <strong>${count}</strong></div>`;
                            }
                        });
						bikeTypesInfo += '</div>';
					}

					popupElement.innerHTML = `
						<div style="font-weight: bold; margin-bottom: 8px;">${station.name || 'Unknown Station'} (${station.station_id})</div>
						<div>🚲 Available bikes: <strong>${station.num_bikes_available || 0}</strong></div>
						<div>📍 Available docks: <strong>${station.num_docks_available || 0}</strong></div>
						<div>📊 Capacity: <strong>${station.capacity || 0}</strong></div>
						<div>📡 Status: <strong>${getStationStatus(station)}</strong></div>
						${bikeTypesInfo}
						${station.last_reported ? `<div style="margin-top: 8px; font-size: 11px;">🕒 Updated: ${station.last_reported.toLocaleTimeString()}</div>` : ''}
					`;

					bikeStationsPopup.setPosition(evt.coordinate);
					popupElement.style.display = 'block';

					// Prevent the default map click behavior
					evt.stopPropagation();
					return false;
				} else {
					if (bikeStationsPopup) {
						bikeStationsPopup.getElement().style.display = 'none';
					}
				}
			};

			// Add the bike station click handler
			window.map.on('click', window.bikeStationClickHandler);

			// Close popup when moving away from bike station markers
			window.map.on('pointermove', function(evt) {
				if (evt.dragging) return;

				// Check if we're hovering over a bike station feature
				let hoveringOverBikeStation = false;
				window.map.forEachFeatureAtPixel(evt.pixel, function(feature) {
					if (feature.get('station')) {
						hoveringOverBikeStation = true;
						return true; // Stop iteration
					}
				});

				// Only hide popup if not hovering over a bike station
				if (!hoveringOverBikeStation && bikeStationsPopup) {
					bikeStationsPopup.getElement().style.display = 'none';
				}
			});
		}

		function getStationStatus(station) {
			if (station.is_renting === 0) return 'Not renting';
			if (station.is_returning === 0) return 'Not returning';
			if (station.is_installed === 0) return 'Not installed';
			return 'Active';
		}

		function zoomToBikeStation(stationId) {
			if (!window.map || !window.bikeStationsData) return;

			// Find the station by stationId
			const station = window.bikeStationsData.find(s => s.station_id === stationId);
			if (station && station.lat && station.lon) {
				// Convert coordinates to map projection
				const coordinates = ol.proj.fromLonLat([station.lon, station.lat]);

				// Create a view with the station centered and zoomed in
				const view = window.map.getView();
				view.animate({
					center: coordinates,
					zoom: 18, // High zoom level to focus on the station
					duration: 1000 // Smooth animation over 1 second
				});
			}
		}

		function hideBikeStationsFromMap() {
			if (window.map && bikeStationsLayer) {
				window.map.removeLayer(bikeStationsLayer);
				bikeStationsLayer = null;
			}
			if (bikeStationsPopup) {
				bikeStationsPopup.getElement().style.display = 'none';
			}
		}
	</script>
</body>
