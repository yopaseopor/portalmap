    <!-- Configure Cesium and load it -->
    <script>
    (function() {
        // Configure Cesium base URL
        window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.105.0/Build/Cesium/';
        window.CESIUM_sourceMap = false;
        
        // Initialize global objects
        window.olcs = window.olcs || {};
        window.Cesium = window.Cesium || {};
        
        // Create a promise to track Cesium loading
        window.cesiumReady = new Promise(function(resolve) {
            var cesiumScript = document.createElement('script');
            cesiumScript.src = 'https://cdn.jsdelivr.net/npm/cesium@1.105.0/Build/Cesium/Cesium.js';
            cesiumScript.onload = function() {
                // Configure Cesium
                Cesium.Ion.defaultAccessToken = '';
                Cesium.buildModuleUrl.setBaseUrl(window.CESIUM_BASE_URL);
                console.log('Cesium loaded successfully');
                resolve();
            };
            cesiumScript.onerror = function() {
                console.error('Failed to load Cesium');
                // Try fallback URL
                cesiumScript.src = 'https://unpkg.com/cesium@1.105.0/Build/Cesium/Cesium.js';
                document.head.appendChild(cesiumScript);
            };
            document.head.appendChild(cesiumScript);
        });
        
        // Load ol-cesium after Cesium is ready
        window.cesiumReady.then(function() {
            var olcsScript = document.createElement('script');
            // Configure ol-cesium script
            olcsScript.src = 'https://unpkg.com/ol-cesium@2.14.0/dist/olcesium.umd.js';
            olcsScript.crossOrigin = 'anonymous';
            
            // Handle successful load
            olcsScript.onload = function() {
                console.log('ol-cesium loaded successfully');
                if (window.olcs && window.olcs.OLCesium) {
                    console.log('ol-cesium is properly initialized');
                    // Initialize the map if it hasn't been initialized yet
                    if (window.initMap && typeof window.initMap === 'function') {
                        window.initMap();
                    }
                } else {
                    console.error('ol-cesium loaded but not properly initialized');
                    console.log('Available properties in olcs:', Object.keys(window.olcs || {}));
                }
            };
            
            // Handle load error
            olcsScript.onerror = function() {
                console.error('Failed to load ol-cesium from CDN, trying fallback');
                // Try alternative CDN if first one fails
                var fallbackScript = document.createElement('script');
                fallbackScript.src = 'https://cdn.jsdelivr.net/npm/ol-cesium@2.14.0/dist/olcesium.umd.js';
                fallbackScript.crossOrigin = 'anonymous';
                
                fallbackScript.onload = function() {
                    console.log('ol-cesium loaded successfully from fallback CDN');
                    if (window.olcs && window.olcs.OLCesium) {
                        console.log('ol-cesium is properly initialized from fallback');
                        // Initialize the map if it hasn't been initialized yet
                        if (window.initMap && typeof window.initMap === 'function') {
                            window.initMap();
                        }
                    } else {
                        console.error('ol-cesium still not properly initialized after fallback');
                    }
                };
                
                fallbackScript.onerror = function() {
                    console.error('Failed to load ol-cesium from fallback CDN');
                    alert('Failed to load 3D functionality. Please check your internet connection and try again.');
                };
                
                document.head.appendChild(fallbackScript);
            };
            
            // Add the script to the document
            document.head.appendChild(olcsScript);
        }).catch(function(error) {
            console.error('Failed to initialize Cesium:', error);
            alert('Failed to load 3D functionality. Please check your internet connection and try again.');
        });
    })();
    </script>
