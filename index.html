    <script>
        // Create global ol namespace before loading OpenLayers
        window.ol = window.ol || {};
        // Add required structures that might be missing in the custom build
        window.ol.structs = window.ol.structs || {};
        
        // Simple LRUCache implementation
        window.ol.structs.LRUCache = class LRUCache {
            constructor(highWaterMark) {
                this.highWaterMark = highWaterMark || 2048;
                this.cache_ = new Map();
                this.oldest_ = null;
                this.newest_ = null;
            }
            get(key) {
                const entry = this.cache_.get(key);
                if (!entry) return undefined;
                if (entry === this.newest_) return entry.value_;
                if (entry.newer) {
                    if (entry === this.oldest_) {
                        this.oldest_ = entry.newer;
                    }
                    entry.newer.older = entry.older;
                }
                if (entry.older) {
                    entry.older.newer = entry.newer;
                }
                entry.newer = null;
                entry.older = this.newest_;
                if (this.newest_) {
                    this.newest_.newer = entry;
                }
                this.newest_ = entry;
                return entry.value_;
            }
            set(key, value) {
                if (this.cache_.has(key)) {
                    this.get(key);
                    this.cache_.get(key).value_ = value;
                    return;
                }
                const entry = {
                    key: key,
                    value_: value,
                    newer: null,
                    older: this.newest_
                };
                if (this.newest_) {
                    this.newest_.newer = entry;
                }
                this.newest_ = entry;
                this.oldest_ = this.oldest_ || entry;
                this.cache_.set(key, entry);
                if (this.cache_.size > this.highWaterMark) {
                    const oldestKey = this.oldest_.key;
                    this.oldest_ = this.oldest_.newer;
                    if (this.oldest_) {
                        this.oldest_.older = null;
                    }
                    this.cache_.delete(oldestKey);
                }
            }
        };
    </script>
